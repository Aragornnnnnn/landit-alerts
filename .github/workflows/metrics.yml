# 지표 알림 — 일일 지표를 매일, 월요일엔 주간 지표를 이어서 디스코드로 보낸다.
# 깨우는 건 버셀 크론(KST 9시대)이다. 아래 schedule은 그게 실패했을 때의 예비책이다
name: metrics

on:
  schedule:
    # 버셀 크론이 KST 9시대에 깨우는 게 주 경로다. 이건 그게 실패했을 때의 늦은 예비책이라
    # 두세 시간 밀려도 상관없다 — 이미 보낸 기간이면 상태 파일을 보고 아무것도 하지 않는다
    - cron: '12 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily 또는 weekly'
        required: true
        default: 'daily'
        type: choice
        options: [daily, weekly]
      date:
        description: '기준일 YYYY-MM-DD (비우면 오늘 KST). 일일은 그 전날, 주간은 그 직전 월~일을 보낸다'
        required: false

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
      AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
      REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
      DISCORD_WEBHOOK_METRICS_DAILY: ${{ secrets.DISCORD_WEBHOOK_METRICS_DAILY }}
      DISCORD_WEBHOOK_METRICS_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_METRICS_WEEKLY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 보낸 기간 복원
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: metrics-state-${{ github.run_id }}
          restore-keys: metrics-state-

      # UTC 0시는 KST 9시와 같은 날이라 UTC 요일로 판정해도 된다
      - name: 월요일인지 확인
        id: day
        run: echo "monday=$([ "$(date -u +%u)" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: 일일 지표 전송
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        run: node src/metrics/run.mjs daily ${{ inputs.date }}

      # 일일이 실패해도 주간은 따로 보낸다 (조회 실패는 기간마다 갈린다)
      - name: 주간 지표 전송
        if: |
          !cancelled() &&
          (inputs.mode == 'weekly' ||
            (github.event_name == 'schedule' && steps.day.outputs.monday == 'true'))
        run: node src/metrics/run.mjs weekly ${{ inputs.date }}

      - name: 보낸 기간 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: metrics-state-${{ github.run_id }}
